name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    name: cargo check (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        features:
          - name: default
            args: ""
          - name: no-default-features
            args: "--no-default-features"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace ${{ matrix.features.args }}
